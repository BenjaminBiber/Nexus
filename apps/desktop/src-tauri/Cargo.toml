# Mitglied des Cargo-Workspace im Wurzelordner; Version und Edition kommen von dort.
[package]
name = "nexus-desktop"
description = "Nexus Desktop"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

# Die Bibliothek trägt den Einstieg, damit das Binary auf allen Plattformen gleich bleibt.
[lib]
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
thiserror = "2"
tokio = { version = "1", features = ["time", "signal", "macros"] }

[features]
# Von `tauri dev` gesetzt, wenn eine eigene Schutzschicht aktiv sein soll.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
