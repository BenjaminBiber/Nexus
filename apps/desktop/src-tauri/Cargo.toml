# Mitglied des Cargo-Workspace im Wurzelordner; Version und Edition kommen von dort.
[package]
name = "nexus-desktop"
description = "Nexus Desktop"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

# Die Bibliothek trägt den Einstieg, damit das Binary auf allen Plattformen gleich bleibt.
[lib]
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
log = "0.4"
# Der Server läuft seit P5-2 im Prozess der App; dazu kommen der Benutzerordner aus nexus-core
# und die Systemfunktionen aus nexus-platform
nexus-core = { workspace = true }
nexus-server = { workspace = true }
nexus-platform = { workspace = true }
# Version 0.13 wie beim Updater-Plugin: sonst landen zwei reqwest-Fassungen samt eigenem
# hyper in der App. Ohne TLS-Merkmal, weil alle Aufrufe an den eigenen Server auf localhost
# gehen; die TLS-Schicht für die Selbstaktualisierung bringt das Updater-Plugin mit.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# Nur für den Kryptoanbieter in src/http.rs: ring liegt über das Updater-Plugin ohnehin im Bau,
# aws-lc-rs wird bewusst nicht eingeschaltet (es würde die App um rund 1 MB größer machen).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tray-icon: Symbol in der Menüleiste; image-png: die Tray-Symbole liegen als PNG neben der App
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
# deep-link: der zweite Start gibt seine nexus://-Links an die laufende Instanz weiter
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# updater: Selbstaktualisierung über latest.json des neuesten Releases; der Neustart danach ist
# tauri::AppHandle::restart, darum braucht es tauri-plugin-process nicht
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
# sync: die Rückfrage des Updaters meldet ihre Antwort über einen oneshot-Kanal zurück
# net: die App bindet den Port des Servers selbst, bevor sie das Fenster öffnet
tokio = { version = "1", default-features = false, features = ["time", "signal", "macros", "sync", "rt", "net"] }

[features]
# Von `tauri dev` gesetzt, wenn eine eigene Schutzschicht aktiv sein soll.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
