<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexus</title>
    <style>
      /* Startseite: bewusst ohne externe Schriften, Bilder oder Skripte, damit sie offline sofort steht. */
      :root {
        color-scheme: light dark;
        --farbe-hintergrund: #11131a;
        --farbe-text: #e8eaf2;
        --farbe-gedaempft: #9aa1b8;
        --farbe-fehler: #ff8a80;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--farbe-hintergrund);
        color: var(--farbe-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      }
      main {
        text-align: center;
        padding: 2rem;
        max-width: 32rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        color: var(--farbe-gedaempft);
      }
      /* Platz für eine spätere Fehlermeldung; leer bleibt der Bereich unsichtbar. */
      #status {
        margin-top: 1rem;
        min-height: 1.5rem;
        color: var(--farbe-fehler);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nexus</h1>
      <p>Nexus startet …</p>
      <div id="status" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
