[package]
name = "nexus-server"
description = "HTTP-API, Dispatch-Worker und Benachrichtigungen von Nexus"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[features]
# Gibt Test-Attrappen (z. B. telegram::fake) auch außerhalb der Modultests frei
testing = []

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
# Pfadmuster der freigegebenen Dokumente und die Quellenzeile der Docs-Tickets
regex = { workspace = true }
nexus-core = { workspace = true }
nexus-db = { workspace = true }
nexus-platform = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
# Vorschlags-GUID der noch nicht eingerichteten Board-Konfig
uuid = { workspace = true }
# Push-Meldungen an ntfy
reqwest = { workspace = true }
# Reihenfolge des ersten Auftretens wie bei einer `Map` in JavaScript
indexmap = { workspace = true }

# Der Test-Ersatz nexus-fake-claude legt sich für einen Modus in eine eigene Prozessgruppe
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process"] }

[dev-dependencies]
# Die Standardwerte für Läufe des Dispatchers stecken im Merkmal `testing` des Fachkerns.
nexus-core = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
# Die Watcher-Tests lassen die Uhr springen (`#[tokio::test(start_paused = true)]`)
tokio = { workspace = true, features = ["test-util"] }
# Der Golden-Vergleich des Lauf-Protokolls ersetzt Zeitstempel und Pfade
regex = { workspace = true }
# Die portierten Tests des BoardRuntimeHolder bauen die Treiberfehler selbst, nach denen die
# Laufzeit als verloren gilt (SQLite-Dateifehler, Socket des SQL Servers)
rusqlite = { workspace = true }
tiberius = { workspace = true }
# Die Tests der Ereignisströme lesen den Körper der Antwort Stück für Stück
futures = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }

# Ersatz für Claude Code in Tests; wird nicht ausgeliefert (P5-4 prüft das).
[[bin]]
name = "nexus-fake-claude"
path = "src/bin/nexus_fake_claude.rs"

# Entwicklungs-Binary: startet den Rust-Server mit --port und --web-dir
[[bin]]
name = "nexus-server"
path = "src/bin/nexus_server.rs"

[lints]
workspace = true
