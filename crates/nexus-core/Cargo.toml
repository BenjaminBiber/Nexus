[package]
name = "nexus-core"
description = "Fachkern von Nexus"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
indexmap = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
# „preserve_order“ für die rohe Übersicht von `OverviewFile::read_value`: `GET
# /api/customizations` gibt unbekannte Felder und ihre Reihenfolge aus der Datei unverändert
# weiter, nur ohne `diff`.
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml_ng = { workspace = true }
sha1_smol = { workspace = true }
sha2 = { workspace = true }
# Temporäre Ordner für den Vergleich der Basis und für die Typprüfung eines eigenen Workflows
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ts-rs = { workspace = true }

# Die Vertrags-Makros und die Fixtures für andere Crates; nur für Tests gedacht.
[features]
testing = []

# Prüft, ob ein fremder Prozess noch läuft (verwaiste Sperrdatei), ohne eigenes `unsafe`
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
sysinfo = { workspace = true }
# Beendet unter Windows einen ganzen Prozessbaum über ein Job-Objekt
win32job = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }

# Die Verträge laufen gegen die Speicher-Datenbank; sie brauchen das Merkmal `testing`.
[[test]]
name = "in_memory_contract"
path = "tests/in_memory_contract.rs"
required-features = ["testing"]

# Die Gegenprobe zum Hook-Kontext baut ihre Zustände mit `BoardFixture`.
[[test]]
name = "kontext_mit_ts"
path = "tests/kontext_mit_ts.rs"
required-features = ["testing"]

[lints]
workspace = true
