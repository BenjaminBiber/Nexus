[package]
name = "nexus-cli"
description = "Kommandozeile von Nexus"
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[lib]
name = "nexus_cli"
path = "src/lib.rs"

# Das Binary heißt `nexus`; in Hilfe und Beispielen steht bis P3-16 weiter „harness“,
# damit der CLI-Vertrag aus contract/cli unverändert grün bleibt.
[[bin]]
name = "nexus"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
nexus-core = { workspace = true }
nexus-db = { workspace = true }
# `nexus serve` startet den Rust-Server samt Node-Sidecar im eigenen Prozess
nexus-platform = { workspace = true }
nexus-server = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
