# Baut das Projekt und führt Typcheck, Unit- und Prozess-Tests auf macOS, Windows und Linux aus.
# Name und Dateiname sind fest: der Release-Workflow prüft über sie, ob die CI für den Release-Commit grün ist.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # Jede Plattform läuft zu Ende, damit ein Fehler auf einer die anderen nicht verdeckt
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Vor dem Checkout: die Tests legen eigene Git-Projekte an, und autocrlf false hält Golden-Dateien unter Windows bei \n
      - name: Git für Tests einrichten
        shell: bash
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          if [ "$RUNNER_OS" = "Windows" ]; then git config --global core.longpaths true; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # Der Build muss vor den Prozess-Tests laufen; vitest.process.setup.ts prüft das
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:process
      # Läuft erst, sobald es die Vertragstests im Repo gibt
      - name: Vertragstests
        if: hashFiles('contract/run.mjs') != ''
        run: npm run contract

  # Formatiert, lintet und testet den Cargo-Workspace (nexus-core, nexus-db, Desktop-App).
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      # Jede Plattform läuft zu Ende, damit ein Fehler auf einer die anderen nicht verdeckt
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Version absichtlich wie in rust-toolchain.toml; beim Anheben beide Stellen ändern
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Nur Linux braucht die Systembibliotheken von Tauri; Windows hat WebView2 ab Werk
      - name: Systempakete für Tauri installieren
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Die TypeScript-Typen aus ts-rs sind eingecheckt: neu erzeugen und prüfen, dass sich
      # nichts ändert. Danach prüft tsc, dass sie zu den heutigen Typen in packages/ passen.
      # Reicht auf einer Plattform, weil das Ergebnis überall gleich ist.
      - name: Erzeugte TypeScript-Typen prüfen
        if: runner.os == 'Linux'
        run: cargo test -p nexus-core export_bindings
      # git diff findet geänderte Dateien, git status zusätzlich neu entstandene
      - name: Erzeugte TypeScript-Typen sind aktuell
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git diff --exit-code -- packages/web/src/api/generated
          neu="$(git status --porcelain -- packages/web/src/api/generated)"
          if [ -n "$neu" ]; then
            echo "Nicht eingecheckte erzeugte Typen:"; echo "$neu"; exit 1
          fi
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
        if: runner.os == 'Linux'
      - name: Erzeugte Typen passen zu packages/core und packages/web
        if: runner.os == 'Linux'
        run: npm run check:bindings
