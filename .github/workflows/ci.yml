# Baut das Projekt und führt Typcheck, Unit- und Prozess-Tests auf macOS, Windows und Linux aus.
# Name und Dateiname sind fest: der Release-Workflow prüft über sie, ob die CI für den Release-Commit grün ist.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # Jede Plattform läuft zu Ende, damit ein Fehler auf einer die anderen nicht verdeckt
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Vor dem Checkout: die Tests legen eigene Git-Projekte an, und autocrlf false hält Golden-Dateien unter Windows bei \n
      - name: Git für Tests einrichten
        shell: bash
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          if [ "$RUNNER_OS" = "Windows" ]; then git config --global core.longpaths true; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # Der Build muss vor den Prozess-Tests laufen; vitest.process.setup.ts prüft das
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:process
      # Läuft erst, sobald es die Vertragstests im Repo gibt
      - name: Vertragstests
        if: hashFiles('contract/run.mjs') != ''
        run: npm run contract
