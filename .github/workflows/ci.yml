# Baut die Oberfläche und führt Typcheck und Tests auf macOS, Windows und Linux aus.
# Name und Dateiname sind fest: der Release-Workflow prüft über sie, ob die CI für den Release-Commit grün ist.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # Jede Plattform läuft zu Ende, damit ein Fehler auf einer die anderen nicht verdeckt
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Vor dem Checkout: die Tests legen eigene Git-Projekte an, und autocrlf false hält Golden-Dateien unter Windows bei \n
      - name: Git für Tests einrichten
        shell: bash
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
          if [ "$RUNNER_OS" = "Windows" ]; then git config --global core.longpaths true; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      # Plugin-Tests und Vertrag brauchen das Binary: der Vertragsserver und die geprüfte CLI
      # sind `nexus`. Version absichtlich wie in rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Die Plugin-Tests bauen das Plugin und brauchen dafür die gebaute Oberfläche
      - run: npm run build
      - run: npm run typecheck
      - run: cargo build -p nexus-cli --bin nexus
      - run: npm test
      # Läuft erst, sobald es die Vertragstests im Repo gibt
      - name: Vertragstests
        if: hashFiles('contract/run.mjs') != ''
        run: npm run contract

  # Misst Server, Hooks und Ereignisstrom auf jedem Runner und vergleicht mit dessen Ausgangswerten.
  # Scheitert, sobald eine Messgröße mehr als 10 % schlechter ist als in contract/baseline-ci-<os>.json.
  bench:
    name: bench (${{ matrix.os }})
    strategy:
      # Jede Plattform läuft zu Ende, damit ein Rückschritt auf einer die anderen nicht verdeckt
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            baseline: linux
          - os: macos-14
            baseline: macos
          - os: windows-latest
            baseline: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Das Messskript legt ein eigenes Git-Projekt für die Hooks an
      - name: Git für die Messung einrichten
        shell: bash
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      # Version absichtlich wie in rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Gemessen wird das Release-Profil: das Debug-Binary wäre um ein Vielfaches langsamer
      - run: cargo build --release -p nexus-cli --bin nexus
      # sseDbBoardLatencyMs folgt dem Abfrage-Takt des Servers (2500 ms) und streut deshalb stark;
      # der Wert wird gemeldet, lässt den Job aber nicht scheitern (siehe scripts/bench/README.md).
      - name: Messen
        shell: bash
        run: node scripts/bench/bench.mjs --out bench-${{ matrix.baseline }}.json
      - name: Mit den Ausgangswerten des Runners vergleichen
        shell: bash
        run: |
          node scripts/bench/compare.mjs \
            --baseline contract/baseline-ci-${{ matrix.baseline }}.json \
            --measured bench-${{ matrix.baseline }}.json \
            --ignore sseDbBoardLatencyMs
      # Immer hochladen: gerade der gescheiterte Lauf soll nachlesbar sein
      - name: Messwerte als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.baseline }}
          path: bench-${{ matrix.baseline }}.json

  # Formatiert, lintet und testet den Cargo-Workspace (nexus-core, nexus-db, Desktop-App).
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      # Jede Plattform läuft zu Ende, damit ein Fehler auf einer die anderen nicht verdeckt
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Version absichtlich wie in rust-toolchain.toml; beim Anheben beide Stellen ändern
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Nur Linux braucht die Systembibliotheken von Tauri; Windows hat WebView2 ab Werk
      - name: Systempakete für Tauri installieren
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: cargo fmt --all --check
      # Das Build-Skript der Desktop-App verlangt den Rust-Server unter binaries/ und die gebaute
      # Oberfläche, die beide erst copy-server.mjs bzw. npm run build anlegen. Für Lint und Tests
      # reichen leere Platzhalter.
      - name: Platzhalter für Sidecar und Oberfläche anlegen
        shell: bash
        run: |
          ziel="$(rustc -vV | sed -n 's/^host: //p')"
          endung=""; if [ "$RUNNER_OS" = "Windows" ]; then endung=".exe"; fi
          mkdir -p apps/desktop/src-tauri/binaries packages/web/dist
          touch "apps/desktop/src-tauri/binaries/nexus-$ziel$endung" packages/web/dist/index.html
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Die TypeScript-Typen aus ts-rs sind eingecheckt: neu erzeugen und prüfen, dass sich
      # nichts ändert. Reicht auf einer Plattform, weil das Ergebnis überall gleich ist.
      - name: Erzeugte TypeScript-Typen prüfen
        if: runner.os == 'Linux'
        run: cargo test -p nexus-core export_bindings
      # git diff findet geänderte Dateien, git status zusätzlich neu entstandene
      - name: Erzeugte TypeScript-Typen sind aktuell
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git diff --exit-code -- packages/web/src/api/generated
          neu="$(git status --porcelain -- packages/web/src/api/generated)"
          if [ -n "$neu" ]; then
            echo "Nicht eingecheckte erzeugte Typen:"; echo "$neu"; exit 1
          fi
