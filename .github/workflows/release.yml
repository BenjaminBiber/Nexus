# Release von Hand starten: Version erhöhen, Tag setzen, Entwurfs-Release anlegen, bauen und veröffentlichen.
# Die Logik steckt in scripts/release/*.sh, damit sie lesbar bleibt und sich lokal durchspielen lässt.
name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Art der Änderungen
        type: choice
        options: [patch, minor, major]
        required: true
      dry_run:
        description: Probelauf ohne Push und ohne Release
        type: boolean
        default: false
      skip_ci:
        description: Nicht auf eine grüne CI für den Commit warten (der Branch muss trotzdem main sein)
        type: boolean
        default: false
# Immer nur ein Release zur Zeit, und keines abbrechen: ein halber Release-Lauf hinterlässt Tag ohne Artefakte
concurrency: release
permissions:
  # Commit und Tag schreiben (der Push selbst läuft über RELEASE_TOKEN), CI-Läufe lesen
  contents: write
  actions: read
jobs:
  # Prüft Branch und CI, setzt die Version, committet, taggt und legt den Entwurf des Releases an
  version:
    name: Version und Entwurf
    runs-on: ubuntu-latest
    # „release“ trägt das RELEASE_TOKEN und lässt nur den Branch „main“ zu.
    # Die Freigabe ist der Start von Hand (workflow_dispatch mit patch/minor/major), keine Required reviewers
    environment: release
    timeout-minutes: 15
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release_id: ${{ steps.r.outputs.release_id }}
    steps:
      # Volle Historie samt Tags: bump.mjs rechnet die nächste Version aus dem höchsten Tag „v*“.
      # Das Token muss RELEASE_TOKEN sein, sonst löst der Push keine weiteren Workflows aus
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Branch und CI prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/check-ci.sh "${{ github.ref }}" "${{ github.sha }}" "${{ inputs.dry_run }}" "${{ inputs.skip_ci }}"
      - name: Version setzen
        id: v
        run: scripts/release/version-job.sh "${{ inputs.bump }}" "${{ inputs.dry_run }}"
      - name: Entwurfs-Release
        id: r
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/draft-release.sh "${{ steps.v.outputs.tag }}" "${{ steps.v.outputs.version }}"

  # Baut je Plattform die Installer, hängt sie an den Entwurf und legt ein CLI-Archiv dazu
  build:
    name: Installer (${{ matrix.target }})
    needs: version
    # „release“ trägt die Signatur-Secrets: Apple, Azure und den privaten Schlüssel des Updaters
    environment: release
    strategy:
      # Jede Plattform läuft zu Ende, damit ein Fehler auf einer die anderen nicht verdeckt
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin, bundles: 'app,dmg' }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, bundles: 'app,dmg' }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, bundles: 'nsis' }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'appimage,deb,rpm' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      # Gebaut wird das Tag aus dem Job „version“, nicht der Stand des Branches. Im Probelauf
      # bleibt das Tag lokal im Job „version“; gebaut wird dann der gestartete Commit
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || needs.version.outputs.tag }}
      # Version absichtlich wie in rust-toolchain.toml; beim Anheben beide Stellen ändern
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Node baut die Oberfläche und das Plugin
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      # Nur Linux braucht die Systembibliotheken von Tauri; rpm ist für das .rpm-Paket nötig
      - name: Systempakete für Tauri installieren
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf rpm
      - run: npm ci
      - run: npm run build
      # Der Server für genau dieses Ziel; das CLI-Archiv nimmt ihn von hier, der Tauri-Build
      # baut ihn über beforeBuildCommand selbst noch einmal
      - run: cargo build --release -p nexus-cli --bin nexus --target ${{ matrix.target }}
      # Der Notarisierungs-Schlüssel muss als Datei vorliegen; ohne Secret entfällt die Notarisierung
      - name: API-Key für Notarisierung
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_API_PRIVATE_KEY" ]; then
            echo "Kein API-Key: Notarisierung entfällt"
            exit 0
          fi
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      # Tauri signiert, sobald APPLE_CERTIFICATE gesetzt ist, auch wenn es leer ist. Ein fehlendes
      # Secret wird in env: zum leeren String, deshalb landen die Variablen nur mit Zertifikat im Job
      - name: Zertifikat für die Apple-Signatur
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Kein Zertifikat: macOS-Build bleibt unsigniert"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
      # signCommand ruft trusted-signing-cli auf; der Cache oben deckt den Build mit ab
      - name: trusted-signing-cli installieren
        if: runner.os == 'Windows'
        run: cargo install trusted-signing-cli --locked
      # Baut die App und lädt dmg, NSIS-Installer, AppImage, deb und rpm an den Entwurf des Releases.
      # Die Apple-Zertifikatsvariablen setzt der Schritt oben nur, wenn es ein Zertifikat gibt; die übrigen
      # Signatur-Variablen dürfen leer sein (Fork, Probelauf), dann überspringt sign-windows.mjs die Signatur.
      # Der Updater-Schlüssel ist davon getrennt (M4): mit ihm entstehen über
      # src-tauri/tauri.release.conf.json die Updater-Artefakte und je Matrix-Job ein Stück von
      # latest.json, das tauri-action am Entwurf zusammenführt.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.version.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true
          # Unter Windows wird nur der NSIS-Installer gebaut; latest.json soll auf ihn zeigen
          updaterJsonPreferNsis: true
      # CLI und Plugin für den Betrieb ohne App; im Probelauf gibt es keinen Entwurf zum Hochladen
      - name: CLI-Archiv
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=$(node scripts/release/cli-archive.mjs --version "${{ needs.version.outputs.version }}" --target "${{ matrix.target }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Probelauf: $file wird nicht hochgeladen"
            exit 0
          fi
          gh release upload "${{ needs.version.outputs.tag }}" "$file" --clobber

  # Prüft, dass alle erwarteten Dateien am Entwurf hängen, hängt die Prüfsummen an und veröffentlicht das Release
  publish:
    name: Veröffentlichen
    needs: [version, build]
    # Im Probelauf gibt es weder Tag bei GitHub noch Entwurf
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Dateien prüfen, Prüfsummen, veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/publish.sh "${{ needs.version.outputs.tag }}" "${{ needs.version.outputs.version }}"
