# Board-Datenbank des AI Harness: SQL Server im Container.
# Beim Start legt der Dienst `init` Login, Datenbanken und fehlende Schema-Versionen an (wiederholbar).
name: ai-harness-db

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD in .env setzen}
      # Obergrenze für den Pufferpool von SQL Server; ohne Limit nimmt er sich den ganzen Docker/WSL-Speicher
      MSSQL_MEMORY_LIMIT_MB: ${HARNESS_DB_MEMORY_MB:-1536}
    # Harte Grenze des Containers (Pufferpool + Server-Overhead), damit er andere Container nicht verdrängt
    mem_limit: ${HARNESS_DB_MEM_LIMIT:-2560m}
    ports:
      - "${HARNESS_DB_BIND:-127.0.0.1}:${HARNESS_DB_PORT:-14333}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      HARNESS_DB_USER: ${HARNESS_DB_USER:-harness}
      HARNESS_DB_PASSWORD: ${HARNESS_DB_PASSWORD:?HARNESS_DB_PASSWORD in .env setzen}
    volumes:
      - ${HARNESS_SQL_DIR:?HARNESS_SQL_DIR in .env setzen}:/sql:ro
      - ./init-db.sh:/init-db.sh:ro
    entrypoint: ["/bin/bash", "/init-db.sh"]

volumes:
  mssql-data:
