<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nexus</title>
    <script>
      // Farbschema vor dem ersten Zeichnen setzen (Wert aus theme.ts/applyTheme), damit kein heller Blitz entsteht
      (function () {
        var mode = "system";
        try {
          mode = localStorage.getItem("harness-theme-mode") || "system";
        } catch (e) {}
        if (["light", "dark", "signal", "pastel", "win95"].indexOf(mode) < 0) mode = "system";
        var dark = mode === "dark" || (mode === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = mode === "system" || mode === "light" || mode === "dark" ? (dark ? "dark" : "light") : mode;
        document.documentElement.dataset.themeMode = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
