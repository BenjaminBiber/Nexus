<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nexus</title>
    <script>
      // Farbschema vor dem ersten Zeichnen setzen (Wert aus theme.ts/applyTheme), damit kein heller Blitz entsteht
      (function () {
        // Installierte Themes: theme.css-URL und Startfarbe aus dem Cache (theme.ts: THEME_CSS_CACHE_KEY, THEME_START_COLOR_KEY)
        var builtin = ["system", "light", "dark", "pastel", "win95"];
        var mode = "system";
        var css = null;
        var color = null;
        try {
          mode = localStorage.getItem("harness-theme-mode") || "system";
          css = localStorage.getItem("harness-theme-css");
          color = localStorage.getItem("harness-theme-start-color");
        } catch (e) {}
        if (!/^[a-z0-9-]{2,40}$/.test(mode)) mode = "system";
        // Ein installiertes Theme gilt nur mit passender theme.css-URL, sonst „system“
        if (builtin.indexOf(mode) < 0 && css !== "/themes/" + mode + "/theme.css") mode = "system";
        // Abgesicherter Modus (?safe-theme): kein Theme-CSS, nur hell/dunkel nach System
        if (builtin.indexOf(mode) < 0 && /[?&]safe-theme(=|&|$)/.test(location.search)) mode = "system";
        var root = document.documentElement;
        var dark = mode === "dark" || (mode === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.dataset.theme = mode === "system" || mode === "light" || mode === "dark" ? (dark ? "dark" : "light") : mode;
        root.dataset.themeMode = mode;
        if (builtin.indexOf(mode) < 0) {
          var link = document.createElement("link");
          link.id = "nexus-theme-css";
          link.rel = "stylesheet";
          link.href = css;
          document.head.appendChild(link);
          if (color && /^#[0-9a-fA-F]{3,8}$/.test(color)) root.style.setProperty("--start-color", color);
        }
      })();
    </script>
    <style>
      /* Startanimation: liegt über der Oberfläche, bis das Video einmal durchgelaufen ist. Hintergründe = --bg je Schema (variables.css) */
      #start-anim { position: fixed; inset: 0; z-index: 2147483647; display: flex; align-items: center; justify-content: center; background: var(--start-color, #f7f7f8); transition: opacity 0.3s ease; }
      [data-theme="dark"] #start-anim { background: #0c0c0e; }
      [data-theme="pastel"] #start-anim { background: #f3eadf; }
      [data-theme="win95"] #start-anim { background: #c0c0c0; }
      #start-anim video { width: min(480px, 60vw); height: auto; }
      /* Das X ist schwarz; auf dunklem Grund wird es hell */
      [data-theme="dark"] #start-anim video { filter: invert(1); }
      #start-anim.is-done { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="start-anim" aria-hidden="true">
      <video src="/start-x.webm" autoplay muted playsinline preload="auto"></video>
    </div>
    <script>
      // Startanimation einmal abspielen, dann ausblenden; ohne Bewegung, bei Fehler oder Hänger sofort bzw. spätestens nach 4 s weg
      (function () {
        var box = document.getElementById("start-anim");
        var video = box.querySelector("video");
        var gone = false;
        function hide() {
          if (gone) return;
          gone = true;
          box.classList.add("is-done");
          setTimeout(function () { box.remove(); }, 300);
        }
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return box.remove();
        video.addEventListener("ended", hide);
        video.addEventListener("error", hide);
        var played = video.play();
        if (played && played.catch) played.catch(hide);
        setTimeout(hide, 4000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
